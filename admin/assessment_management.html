        <main>
            <header><h2>Assessment Management</h2></header>
            <hr>

            <section>
                
                <form action="">
                    <label for="a-search">Search Student:</label>
                    <input type="search" id="a-search" name="a-search" placeholder="Search alias">
                    <input type="submit" value="Search">
                </form>


                <form action="">
                <label for="risk-level">Risk Level:</label>
                <select id="risk-level" name="risk-level">
                    <option value="All Risk Level">All Risk Level</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                </form>

                <form action="">
                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="All Status">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Reviewed">Reviewed</option>
                    <option value="Referred">Referred</option>
                </select>
                </form>

            </section>

            <section>

                <article class="">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Alias</th>
                                <th>Risk Level</th>
                                <th>PHQ-9</th>
                                <th>GAD-7</th>

                                <th>Status</th>
