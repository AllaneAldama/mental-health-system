<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Report</title>
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <main class="">
      <div class="">
        <a href="assessment_management.html">&lt; Back to Assessments</a>
      </div>

      <header class="">
        <div class="">
          <h1>Student Report</h1>
          <p class="">Alias</p>
        </div>

        <div class="">
          <button class="">Mark as Reviewed</button>

          <button class="">Recommend Referral</button>
        </div>
      </header>

      <section class="">
        <article class="">
          <h2>Summary</h2>

          <div class="">
            <span>Risk Level</span>
            <span class="">High</span>
          </div>

          <div class="">
            <span>PHQ-9 Score</span>
            <strong>--/--</strong>
          </div>

          <div class="">
            <span>GAD-7 Score</span>
            <strong>--/--</strong>
          </div>

          <div class="">
            <span>Submitted At</span>
            <strong>--- --, ---- --:-- --</strong>
          </div>
        </article>

        <article class="">
          <h2>Assessment Details</h2>

          <nav class="">
            <button class="">PHQ-9 (Depression)</button>

            <button class="">GAD-7 (Anxiety)</button>
          </nav>

          <table class="">
            <thead>
              <tr>
                <th>Question</th>
                <th>Score</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>1.</td>
                <td>-</td>
              </tr>

              <tr>
                <td>2.</td>
                <td>-</td>
              </tr>

              <tr>
                <td>3.</td>
                <td>-</td>
              </tr>

              <tr>
                <td>4.</td>
                <td>-</td>
              </tr>
            </tbody>
          </table>
        </article>
      </section>
    </main>
  </body>
</html>
